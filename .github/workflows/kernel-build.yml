name: Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android 版本'
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
        default: android14
      kernel_version:
        description: 'Kernel 版本'
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
        default: "6.1"
      sub_level:
        description: 'Sub Level 版本'
        required: true
        type: string
        default: '124'
      os_patch_level:
        description: 'OS Patch Level'
        required: true
        type: string
        default: '2025-02'
      revision:
        description: 'Android 12 Revision (可选)'
        required: false
        type: string
        default: ''
      kernelsu_version:
        description: 'SukiSU 版本'
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
        default: Stable(标准)
      kernelsu_commit:
        description: '指定 KernelSU commit hash (可选)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: '指定 SUSFS commit hash'
        required: false
        type: string
        default: ''
      custom_version:
        description: '自定义版本名称 (可选)'
        required: false
        type: string
        default: ''
      use_zram:
        description: '启用 ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: false
      use_kpm:
        description: '启用 KPM'
        required: true
        type: boolean
        default: true
      BBG:
        description: '启用 Baseband-guard'
        required: true
        type: boolean
        default: false
      supp_op:
        description: '启用 OnePlus 8E 支持'
        required: true
        type: boolean
        default: false
      set_defbbr:
        description: '设置 BBR 为默认拥塞算法'
        required: true
        type: boolean
        default: false
      make_release:
        description: '创建 GitHub Release'
        required: true
        type: boolean
        default: true
      send_telegram:
        description: '发送 Telegram 通知'
        required: true
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5 libtinfo5 ccache python3 git curl wget zip unzip xz-utils \
            openssl pixz lz4 zstd rsync cpio
          pip install PyYAML

      - name: Setup AVB signing key
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
          if [[ -n "$BOOT_SIGN_KEY" ]]; then
            KEY_PATH="$RUNNER_TEMP/boot-sign-key.pem"
            umask 077
            printf '%s\n' "$BOOT_SIGN_KEY" > "$KEY_PATH"
            openssl pkey -in "$KEY_PATH" -check -noout
            echo "BOOT_SIGN_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          else
            echo "::notice::BOOT_SIGN_KEY is unset; only AnyKernel3 ZIPs will be generated."
          fi

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-

      - name: Build kernel
        id: build-kernel
        env:
          ANDROID_VERSION: ${{ github.event.inputs.android_version }}
          KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
          SUB_LEVEL: ${{ github.event.inputs.sub_level }}
          OS_PATCH: ${{ github.event.inputs.os_patch_level }}
          REVISION: ${{ github.event.inputs.revision }}
          KSU_VERSION: ${{ github.event.inputs.kernelsu_version }}
          KSU_COMMIT: ${{ github.event.inputs.kernelsu_commit }}
          SUSFS_COMMIT: ${{ github.event.inputs.susfs_commit }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
          USE_ZRAM: ${{ github.event.inputs.use_zram }}
          USE_KPM: ${{ github.event.inputs.use_kpm }}
          USE_BBG: ${{ github.event.inputs.BBG }}
          SUPPORT_OP8E: ${{ github.event.inputs.supp_op }}
          DEFAULT_BBR: ${{ github.event.inputs.set_defbbr }}
        run: |
          cd ./.github/workflows/scripts
          ARGS=(--android "$ANDROID_VERSION" --kernel "$KERNEL_VERSION"
                --sub-level "$SUB_LEVEL" --os-patch "$OS_PATCH"
                --ksu-version "$KSU_VERSION" --no-release)
          if [[ -n "$REVISION" ]]; then ARGS+=("--revision=$REVISION"); fi
          if [[ "$USE_ZRAM" == true ]]; then ARGS+=(--zram); fi
          if [[ "$USE_KPM" == false ]]; then ARGS+=(--no-kpm); fi
          if [[ "$USE_BBG" == true ]]; then ARGS+=(--bbg); fi
          if [[ -n "$KSU_COMMIT" ]]; then ARGS+=("--ksu-commit=$KSU_COMMIT"); fi
          if [[ -n "$SUSFS_COMMIT" ]]; then ARGS+=("--susfs-commit=$SUSFS_COMMIT"); fi
          if [[ -n "$CUSTOM_VERSION" ]]; then ARGS+=("--custom-version=$CUSTOM_VERSION"); fi
          if [[ "$SUPPORT_OP8E" == true ]]; then ARGS+=(--op8e); fi
          if [[ "$DEFAULT_BBR" == true ]]; then ARGS+=(--bbr); fi

          python3 build.py "${ARGS[@]}"

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          find /tmp/gki-build -name "*.zip" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "*.img" -type f -exec cp {} artifacts/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}
          path: artifacts/*

      - name: Generate checksums
        run: |
          echo "=== Creating checksums ==="
          sha256sum artifacts/* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Send Telegram Notification
        if: ${{ github.event.inputs.send_telegram == 'true' && success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          cd ./.github/workflows/scripts
          python3 telegram_notify.py single \
            "${{ github.event.inputs.android_version }}" \
            "${{ github.event.inputs.kernel_version }}" \
            "${{ github.event.inputs.sub_level }}" \
            "${{ github.event.inputs.os_patch_level }}" \
            "${{ github.event.inputs.kernelsu_version }}" \
            "${{ github.event.inputs.use_zram }}" \
            "${{ github.event.inputs.use_kpm }}" \
            "$GITHUB_WORKSPACE/SHA256SUMS.txt"
