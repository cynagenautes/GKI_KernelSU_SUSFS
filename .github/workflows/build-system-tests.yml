name: Build system tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_smoke:
        description: Compile and package the representative Android 14 kernel
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s tests -v

  kernel-smoke:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.kernel_smoke) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[kernel-smoke]')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GKI_BUILD_JOBS: '2'
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5 libtinfo5 ccache python3 git curl wget zip unzip xz-utils \
            openssl pixz lz4 zstd rsync cpio
          python -m pip install PyYAML
      - name: Compile and package Android 14 kernel
        run: |
          python .github/workflows/scripts/build.py \
            --android android14 --kernel 6.1 --sub-level 124 --os-patch 2025-02 \
            --no-release --workspace /tmp/gki-smoke \
            --output-json "$RUNNER_TEMP/kernel-build-result.json" \
            2>&1 | tee "$RUNNER_TEMP/kernel-build.log"
      - name: Report kernel failure
        if: failure()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'kernel-build.log'
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              errors = [line for line in lines if any(term in line.lower() for term in ('error:', 'fatal:', 'error -', 'failed:', 'runtimeerror', 'not found'))]
              message = '\n'.join(errors[-12:] or lines[-12:])[-6000:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Representative kernel build failed::{message}')
          PY
      - name: Upload smoke-build kernel packages
        uses: actions/upload-artifact@v7
        with:
          name: kernel-smoke-android14-6.1-124
          path: /tmp/gki-smoke/android14-6.1-124/*.zip
          if-no-files-found: error
